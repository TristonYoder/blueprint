name: Build container

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  check-flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix flake check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix shell nixpkgs#nodejs_22 --command npm ci
      - run: nix shell nixpkgs#nodejs_22 --command npm test

  build:
    needs: [check-flake, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build image
        run: nix build .#docker
      - name: Load and tag image
        run: |
          docker load < result
          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          docker tag blueprint:latest ghcr.io/${{ github.repository }}:$SHA_TAG
          echo "SHA_TAG=$SHA_TAG" >> "$GITHUB_ENV"
      - name: Tag latest (main only)
        if: github.ref == 'refs/heads/main'
        run: docker tag blueprint:latest ghcr.io/${{ github.repository }}:latest
      - name: Tag release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker tag blueprint:latest ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push
        run: docker push --all-tags ghcr.io/${{ github.repository }}
